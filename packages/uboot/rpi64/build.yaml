# u-boot refuses GCC older than 10 on arm from v2026.01 on
# (arch/arm/config.mk, target checkgcc10). The shared
# development/toolchain image is pinned to ubuntu:20.04 on purpose, for
# its old glibc, and that ships GCC 9. Build on an image of our own
# instead, as kernels/linux-rpi already does: u-boot.bin is freestanding,
# so the toolchain's glibc floor does not apply to it.
image: ubuntu:24.04

package_dir: /output

env:
  - DEBIAN_FRONTEND=noninteractive
  - GITHUB_ORG={{ ( index .Values.labels "github.owner" ) }}
  - GITHUB_REPO={{ ( index .Values.labels "github.repo" ) }}
{{ if .Values.arch }}
  {{ if eq .Values.arch "amd64" }}
  - CROSS_COMPILE=aarch64-linux-gnu-
  {{ end }}
{{ end }}

prelude:
  - apt-get update -y && apt-get install -y build-essential git bc bison flex libssl-dev libgnutls28-dev uuid-dev pkg-config swig python3 python3-dev python3-setuptools python3-pyelftools device-tree-compiler
{{ if .Values.arch }}
  {{ if eq .Values.arch "amd64" }}
  - apt-get install -y gcc-aarch64-linux-gnu
  {{ end }}
{{ end }}
  - mkdir build/${GITHUB_ORG}/ -p
  - mkdir /output -p
  - git clone --depth 1 --branch v${PACKAGE_VERSION%\-*} https://github.com/${GITHUB_ORG}/${GITHUB_REPO}.git build/${GITHUB_ORG}

steps:
  - cd build/${GITHUB_ORG} && make rpi_arm64_defconfig
  - cd build/${GITHUB_ORG} && make -j$(nproc) all
  - cp build/${GITHUB_ORG}/u-boot.bin /output
  - cp ubootconfig.txt /output
