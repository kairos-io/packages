name: ci-robbot auto-approve
on:
- pull_request_target

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    # Check the account that CREATED the pull request, not github.actor.
    # github.actor is whoever performed the most recent action on it, so on a
    # reopen or a push by the bot it names the bot on a pull request somebody
    # else wrote, and this job would approve that pull request and queue it for
    # auto-merge. renovate_auto.yml in this repository already uses this form.
    if: ${{ github.event.pull_request.user.login == 'ci-robbot' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Approve a PR if not already approved
        run: |
          gh pr checkout "$PR_URL"
            if [ "$(gh pr status --json reviewDecision -q .currentBranch.reviewDecision)" != "APPROVED" ];
          then
            gh pr review --approve "$PR_URL"
          else
            echo "PR already approved.";
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
